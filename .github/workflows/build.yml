name: Build

# 不随普通推送自动编译（省机时）；出包走两条路：
#   1. 推送 v* 标签 → 自动创建 Release 并附安装包
#   2. Actions 页 Run workflow 手动触发 → 产物在本次运行的 Artifacts
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # 推送 v* 标签时自动创建 GitHub Release 并附上安装包；
      # 手动触发（workflow_dispatch）只出产物（Artifacts），不发 Release
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "zcode-speed-panel __VERSION__"
          releaseDraft: false
          prerelease: false
          releaseBody: "Windows 安装包（NSIS）。下载 `zcode-speed-panel_x.y.z_x64-setup.exe` 安装即可。"
          args: --target x86_64-pc-windows-msvc

      # 免安装版：直接复制主程序 exe 并按版本号命名（与安装版 _x64-setup.exe 区分）
      - name: Prepare portable exe
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp "src-tauri/target/x86_64-pc-windows-msvc/release/zcode-speed-panel.exe" \
             "zcode-speed-panel_${VERSION}_x64-portable.exe"
          echo "PORTABLE=zcode-speed-panel_${VERSION}_x64-portable.exe" >> "$GITHUB_ENV"

      # 标签构建时把免安装版也附到 Release（安装版由 tauri-action 上传）
      - name: Upload portable exe to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${PORTABLE}" --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            ${{ env.PORTABLE }}
          if-no-files-found: error
